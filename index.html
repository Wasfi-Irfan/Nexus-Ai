<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Full Screen View</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Matches a dark AI/Disaster dashboard theme */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 420px; /* Forces Chrome Side Panel dimensions */
            height: 100%;
            max-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: #1e293b;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Links directly to your original program -->
        <iframe src="app.html" title="NEXUS Application"></iframe>
    </div>

</body>
</html>
